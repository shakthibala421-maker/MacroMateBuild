name: Check MacroMate Project

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -q "MacroMate-android-project.zip" -d project

      - name: Find Android project files
        run: |
          echo "===== GRADLE WRAPPER ====="
          find project -name "gradlew" -type f

          echo "===== SETTINGS FILE ====="
          find project -name "settings.gradle*" -type f

          echo "===== BUILD FILES ====="
          find project -name "build.gradle*" -type f

          echo "===== PROJECT FOLDERS ====="
          find project -maxdepth 3 -type d
