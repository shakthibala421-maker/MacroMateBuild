name: Build MacroMate APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q "MacroMate-android-project.zip" -d project

      - name: Find Gradle version
        run: |
          cat project/MacroMate/gradle/wrapper/gradle-wrapper.properties
          VERSION=$(grep distributionUrl project/MacroMate/gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          echo "GRADLE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Gradle version: $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build APK
        working-directory: project/MacroMate
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MacroMate-APK
          path: project/MacroMate/app/build/outputs/apk/debug/*.apk
